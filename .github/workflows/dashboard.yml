name: Report progress to Mission Control

on:
  push:
    branches: [main]
  schedule:
    # 매일 07:00 KST (UTC 22:00 전날)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report progress
        env:
          MISSION_CONTROL_TOKEN: ${{ secrets.MISSION_CONTROL_TOKEN }}
        run: node scripts/report-progress.mjs
